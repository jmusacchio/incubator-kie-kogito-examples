/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.org.kie.kogito.kogito.serverless.workflow.executor
    api libs.org.slf4j.slf4j.simple.x1
    testImplementation libs.org.assertj.assertj.core.x1
    testImplementation libs.org.junit.jupiter.junit.jupiter.engine
}

description = 'Kogito Example :: SonataFlow :: Java Embedded examples'

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing.publications.maven.artifact(testsJar)
