plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.org.apache.kie.sonataflow.sonataflow.quarkus
    api libs.io.quarkus.quarkus.resteasy
    api libs.io.quarkus.quarkus.resteasy.jackson
    api libs.io.quarkus.quarkus.resteasy.client.oidc.filter
    api libs.org.kie.kie.addons.quarkus.persistence.jdbc
    api libs.io.quarkus.quarkus.agroal
    api libs.io.quarkus.quarkus.jdbc.postgresql
    api libs.org.kie.kie.addons.quarkus.process.management
    api libs.org.kie.kie.addons.quarkus.source.files
    api libs.org.kie.kogito.addons.quarkus.data.index.persistence.postgresql
    testImplementation libs.io.quarkus.quarkus.junit5
    testImplementation libs.io.rest.assured.rest.assured
    testImplementation libs.org.awaitility.awaitility
}

description = 'Kogito Example :: Serverless Workflow Data Index persistence addon :: Quarkus'
