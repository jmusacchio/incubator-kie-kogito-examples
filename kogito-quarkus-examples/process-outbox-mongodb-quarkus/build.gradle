/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.org.jbpm.jbpm.quarkus
    api libs.io.quarkus.quarkus.resteasy
    api libs.io.quarkus.quarkus.resteasy.jackson
    api libs.org.kie.kie.addons.quarkus.persistence.mongodb
    api libs.org.kie.kie.addons.quarkus.events.mongodb
    api libs.io.quarkus.quarkus.container.image.jib
    testImplementation libs.org.slf4j.slf4j.simple.x1
    testImplementation libs.org.kie.kogito.kogito.quarkus.test.utils
    testImplementation libs.io.rest.assured.rest.assured
    testImplementation libs.org.awaitility.awaitility.x1
    testImplementation libs.com.jayway.jsonpath.json.path
}

description = 'Kogito Example :: Process Transactional Outbox :: MongoDB and Quarkus'

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing.publications.maven.artifact(testsJar)
