plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.io.quarkus.quarkus.resteasy
    api libs.io.quarkus.quarkus.resteasy.jackson
    api libs.io.quarkus.quarkus.smallrye.openapi
    api libs.io.quarkus.quarkus.smallrye.health
    api libs.org.jbpm.jbpm.with.drools.quarkus
    api libs.org.jbpm.jbpm.quarkus
    api libs.org.kie.kie.addons.quarkus.process.management
    api libs.org.kie.kogito.addons.quarkus.jobs.management
    api libs.org.kie.kie.addons.quarkus.process.svg
    api libs.org.kie.kie.addons.quarkus.source.files
    api libs.io.quarkus.quarkus.jdbc.postgresql
    api libs.io.quarkus.quarkus.agroal
    api libs.org.kie.kie.addons.quarkus.persistence.jdbc
    api libs.org.kie.kogito.addons.quarkus.data.index.postgresql
    api libs.org.kie.kogito.addons.quarkus.jobs
    api libs.org.kie.kogito.jobs.service.postgresql.common
    api libs.org.kie.kogito.addons.quarkus.data.audit.jpa
    api libs.org.kie.kogito.addons.quarkus.data.audit
}

description = 'Kogito Example :: Process Instance Migration Quarkus'

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing.publications.maven.artifact(testsJar)
