/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.org.drools.drools.quarkus.decisions
    api libs.org.kie.kie.addons.quarkus.events.decisions
    api libs.io.quarkus.quarkus.resteasy
    api libs.io.quarkus.quarkus.arc
    api libs.io.quarkus.quarkus.resteasy.jackson
    api libs.io.quarkus.quarkus.messaging.kafka
    api libs.io.quarkus.quarkus.smallrye.health
    testImplementation libs.io.quarkus.quarkus.junit5
    testImplementation libs.org.junit.jupiter.junit.jupiter.params
    testImplementation libs.org.awaitility.awaitility.x1
    testImplementation libs.org.kie.kogito.kogito.quarkus.test.utils
    testImplementation libs.org.skyscreamer.jsonassert
}

description = 'Kogito Example :: DMN Event-Driven :: Quarkus'

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing.publications.maven.artifact(testsJar)
