plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.org.jbpm.jbpm.with.drools.quarkus
    api libs.org.kie.kie.addons.quarkus.messaging
    api libs.org.kie.kie.addons.quarkus.process.svg
    api libs.io.quarkus.quarkus.reactive.routes
    api libs.io.quarkus.quarkus.qute
    api libs.io.quarkus.quarkus.resteasy
    api libs.io.quarkus.quarkus.resteasy.jackson
    api libs.io.quarkus.quarkus.hibernate.validator
    api libs.org.kie.kie.addons.quarkus.monitoring.prometheus
    api libs.org.kie.kie.addons.quarkus.events.process
    api libs.org.kie.kie.addons.quarkus.process.management
    api libs.org.drools.drools.decisiontables
    api libs.io.quarkus.quarkus.messaging.kafka
    api libs.io.quarkus.quarkus.smallrye.openapi
    api libs.org.kie.kie.addons.quarkus.source.files
    testImplementation libs.io.quarkus.quarkus.junit5
    testImplementation libs.io.rest.assured.rest.assured
    testImplementation libs.org.kie.kogito.kogito.quarkus.test.utils
}

description = 'Kogito Example :: Travel Agency :: Travels'

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing.publications.maven.artifact(testsJar)
