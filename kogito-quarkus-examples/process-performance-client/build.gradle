/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.io.smallrye.reactive.smallrye.mutiny.vertx.web.client
    api libs.org.apache.kafka.kafka.clients
    api libs.org.slf4j.slf4j.simple.x1
    api libs.com.fasterxml.jackson.core.jackson.databind
    api libs.com.fasterxml.jackson.datatype.jackson.datatype.jsr310
    api libs.org.kie.kogito.kogito.events.api
    api libs.org.kie.kogito.kogito.services
}

description = 'Kogito Example :: Client Performance test'

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing.publications.maven.artifact(testsJar)
