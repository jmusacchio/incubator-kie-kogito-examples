/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.org.springframework.boot.spring.boot.starter.actuator
    api libs.org.springframework.kafka.spring.kafka
    api libs.org.kie.kie.addons.springboot.messaging
    api libs.com.fasterxml.jackson.core.jackson.databind
    api libs.org.jbpm.jbpm.spring.boot.starter
    api libs.io.cloudevents.cloudevents.json.jackson
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    testImplementation libs.org.springframework.kafka.spring.kafka.test
    testImplementation libs.org.kie.kogito.kogito.spring.boot.test.utils
}

description = 'Kogito Example :: Process with Kafka and Spring Boot'

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing.publications.maven.artifact(testsJar)
