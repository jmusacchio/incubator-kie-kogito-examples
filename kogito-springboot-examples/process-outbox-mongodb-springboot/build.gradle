/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.org.springframework.boot.spring.boot.starter.actuator
    api libs.org.kie.kogito.kogito.api
    api libs.org.jbpm.jbpm.spring.boot.starter
    api libs.org.springframework.boot.spring.boot.starter.data.mongodb
    api libs.org.kie.kie.addons.springboot.persistence.mongodb
    api libs.org.kie.kie.addons.springboot.events.mongodb
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    testImplementation libs.org.kie.kogito.kogito.spring.boot.test.utils
    testImplementation libs.io.rest.assured.rest.assured
    testImplementation libs.org.awaitility.awaitility.x1
    testImplementation libs.com.jayway.jsonpath.json.path
}

description = 'Kogito Example :: Process Transactional Outbox :: MongoDB and Spring Boot'

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing.publications.maven.artifact(testsJar)
