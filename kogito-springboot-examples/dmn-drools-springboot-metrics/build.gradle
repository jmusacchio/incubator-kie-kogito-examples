/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.org.drools.drools.decisions.spring.boot.starter
    api libs.org.drools.drools.rules.spring.boot.starter
    api libs.org.kie.kie.addons.springboot.monitoring.prometheus
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    testImplementation libs.io.rest.assured.rest.assured
    testImplementation libs.org.testcontainers.junit.jupiter
    testImplementation libs.org.kie.kogito.kogito.test.utils
}

description = 'Kogito Example :: DMN Metrics SpringBoot'

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing.publications.maven.artifact(testsJar)
